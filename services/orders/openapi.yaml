openapi: 3.1.0
info:
  title: Orders service
  version: 2.0.0
  description: Places orders and moves them through their lifecycle. Part of the Shop.
paths:
  /orders:
    post:
      summary: Places an order at the quoted total
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines, deliveryAddress]
              properties:
                deliveryAddress:
                  type: object
                  description: "The address the order goes to; the Warehouse books the carrier with it when the order ships"
                  required: [street, city, postalCode, country]
                  properties:
                    street: { type: string }
                    city: { type: string }
                    postalCode: { type: string }
                    country: { type: string, pattern: '^[A-Z]{2}$', description: "A two-letter country code, such as PL" }
                lines:
                  type: array
                  items:
                    type: object
                    required: [sku, unitPrice, quantity]
                    properties:
                      sku: { type: string }
                      unitPrice: { type: number }
                      quantity: { type: integer, minimum: 1 }
                code: { type: string }
      responses:
        '201': { description: The placed order }
        '400': { description: An empty cart, a cart pricing refuses, or an order without a complete delivery address; no order is stored }
        '503': { description: Pricing cannot be reached; nothing is kept }
  /orders/{id}:
    get:
      summary: Reads an order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The order, with its delivery address }
        '404': { description: No such order }
  /orders/{id}/pay:
    post:
      summary: Reserves the goods in the Warehouse and marks the order paid
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The paid order, also for an order paid already }
        '409': { description: The goods are short, or the order cannot be paid; it stays as it was }
        '503': { description: The Warehouse cannot be reached; the order stays placed }
  /orders/{id}/ship:
    post:
      summary: Has the Warehouse dispatch the goods and marks the order shipped
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The shipped order, with its tracking number }
        '409': { description: The order cannot be shipped }
        '503': { description: The Warehouse or its carrier cannot do it now; the order stays paid }
  /orders/{id}/return:
    post:
      summary: Takes a shipped order back within 14 days of shipping, and has the Warehouse put the goods back on its shelves
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The returned order }
        '409': { description: The order is not shipped, or was shipped more than 14 days before; it stays as it was }
        '503': { description: The Warehouse cannot put the goods back now; the order stays shipped }
  /orders/{id}/tracking:
    get:
      summary: Reads the tracking number of a shipped order, the carrier's status of its delivery and its estimated delivery date, from the Warehouse; changes nothing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The tracking number, the carrier's status of the delivery, its estimated delivery date and its delivery time
          content:
            application/json:
              schema:
                type: object
                required: [trackingNumber, status, estimatedDeliveryDate, deliveredAt]
                properties:
                  trackingNumber: { type: string }
                  status: { type: string, enum: [in-transit, delivered, lost] }
                  estimatedDeliveryDate: { type: [string, 'null'], format: date, description: "The date the carrier gave when it booked the parcel, as it gave it; null when it gave none" }
                  deliveredAt: { type: [string, 'null'], format: date-time, description: "The date and time the carrier reports the parcel was delivered, as it gave it, like 2026-11-21T10:30:00Z; null when the status is not delivered or the carrier gave no time for a delivered one" }
        '404': { description: No such order }
        '409': { description: The order has not shipped; the Warehouse is not asked }
        '503': { description: The Warehouse cannot give the carrier status now; the order stays as it is }
  /orders/{id}/cancel:
    post:
      summary: Cancels a placed order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: The cancelled order }
        '409': { description: The order cannot be cancelled }
